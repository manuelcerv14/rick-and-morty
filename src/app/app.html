<!-- ESPECIE -->

        <div class="col-md-4">

          <label class="form-label text-secondary">
            Especie
          </label>

          <select
            #especieSelect
            class="form-select bg-dark text-white border-secondary"
            (change)="buscarPorEspecie(especieSelect.value)"
          >

            <option value="" disabled selected>
              Selecciona una especie
            </option>

            <option value="Human">
              Humano
            </option>

            <option value="Alien">
              Alien
            </option>

          </select>

        </div>


        <!-- GÉNERO -->

        <div class="col-md-4">

          <label class="form-label text-secondary">
            Género
          </label>

          <select
            #generoSelect
            class="form-select bg-dark text-white border-secondary"
            (change)="buscarPorGenero(generoSelect.value)"
          >

            <option value="" disabled selected>
              Selecciona un género
            </option>

            <option value="Male">
              Masculino
            </option>

            <option value="Female">
              Femenino
            </option>

            <option value="Genderless">
              Sin género
            </option>

            <option value="unknown">
              Desconocido
            </option>

          </select>

        </div>

      </div>
